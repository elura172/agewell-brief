name: Aggregate health briefs

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Preview stores a review artifact. Publish enables the existing release steps."
        type: choice
        required: true
        default: preview
        options:
          - preview
          - publish
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"

concurrency:
  group: agewell-aggregation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build trend radar
        continue-on-error: true
        run: python -m scripts.trend_radar
      - name: Generate daily edition
        id: aggregate
        run: python -m agewell.pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          LLM_BASE_URL: https://api.deepseek.com
          LLM_MODEL: deepseek-v4-flash
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          RSS_FEEDS_JSON: ${{ secrets.RSS_FEEDS_JSON }}
          MAX_ITEMS: 1
          MAX_ITEMS_PER_PUBLISHER: 2
          # Scheduled runs retain the existing unattended-release behavior.
          # Manual dispatches default to preview and create drafts; choosing
          # publish explicitly opts into the release steps below.
          AUTO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.run_mode == 'publish' }}
      - name: Cross-tag topics & frameworks
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m scripts.verify_and_cross_tag_briefs
      - name: Validate Upload-Post account
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Apikey ${UPLOAD_POST_API_KEY}" \
            https://api.upload-post.com/api/uploadposts/me
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      - name: Prepare social packages for release
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: python3 -m scripts.social_package --output .state/social/latest.json
      - name: Update reader trends
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        continue-on-error: true
        run: python3 -m scripts.cloudflare_trending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Sync persistent social manifest
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: python3 -m scripts.social_manifest sync --packages .state/social/latest.json
      - name: Commit generated drafts
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "https://agewellbrief.com"
          changed = subprocess.run(
              ["git", "status", "--porcelain", "--", "content/posts"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          urls = []
          for line in changed:
              path = line[3:].strip()
              if path.startswith("content/posts/") and path.endswith(".md"):
                  slug = Path(path).stem
                  urls.append(f"{base}/brief/{slug}/")
          Path("/tmp/agewell-indexnow-urls.txt").write_text(
              "\n".join(dict.fromkeys(urls)) + ("\n" if urls else "")
          )
          PY
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- content/posts public/images public/*.txt .state
          git diff --cached --quiet || git commit -m "chore: add aggregated health briefs"
          git push
      # Runs after the briefs are committed and pushed, so the canonical URL
      # each Substack post links back to already exists. Substack's RSS import
      # is a one-time archive import, not a live sync, so delivery has to be
      # pushed. Skips cleanly (exit 0) when SUBSTACK_SID is unset.
      # Deliberately not continue-on-error. The script exits 0 for every benign
      # outcome — nothing to send, no credential set, a transient error the next
      # run retries — and non-zero only when Substack rejects the credential.
      # That is the one state that never recovers on its own, so it should turn
      # the run red and send the failure notification rather than stalling
      # quietly while briefs pile up unsent.
      - name: Publish briefs to Substack
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: python3 scripts/substack_publisher.py --publish --limit 3
        env:
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
          SUBSTACK_DOMAIN: agewellbrief
      - name: Commit Substack publish ledger
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: |
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          # The ledger is what stops the next run reposting the same briefs, so
          # it has to land even if a later step fails.
          git add .state/substack-published.json || true
          git diff --cached --quiet || git commit -m "chore: record Substack publish ledger"
          git push || true
      - name: Submit released article copy to Facebook
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        continue-on-error: true
        run: python3 -m scripts.publish_facebook --packages .state/social/latest.json
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USERNAME: ${{ secrets.UPLOAD_POST_USERNAME }}
      - name: Commit social handoff state
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        run: |
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .state/social .state/content-records .state/video-jobs
          git diff --cached --quiet || git commit -m "chore: record social publishing handoff"
          git push
      - name: Notify IndexNow
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.run_mode == 'publish') }}
        continue-on-error: true
        run: |
          if [ -s /tmp/agewell-indexnow-urls.txt ]; then
            python3 -m scripts.submit_indexnow --urls-file /tmp/agewell-indexnow-urls.txt
          else
            echo "IndexNow: no article changes in this run"
          fi
        env:
          PUBLIC_SITE_URL: https://agewellbrief.com
          INDEXNOW_KEY_FILE: public/c82fc24c87f9437da381a53fd326273d.txt
      - name: Package preview for review
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'preview' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          output = Path("/tmp/agewell-preview")
          output.mkdir(parents=True, exist_ok=True)
          changed = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--", "content/posts", "public/images/editions", ".state/editions"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          for line in changed:
              relative = line[3:].strip()
              source = Path(relative)
              if source.is_file():
                  target = output / source
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          (output / "README.txt").write_text(
              "Agewell Brief editorial preview\n"
              "This artifact contains only files generated or changed by this run.\n"
              "Preview mode does not commit, publish to Substack or Facebook, update reader trends, or notify IndexNow.\n",
              encoding="utf-8",
          )
          PY
      - name: Upload review artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: agewell-preview-${{ github.run_id }}
          path: /tmp/agewell-preview/
          if-no-files-found: error
          retention-days: 7
