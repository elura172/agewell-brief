name: Aggregate health briefs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"

concurrency:
  group: agewell-aggregation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build trend radar
        continue-on-error: true
        run: python -m scripts.trend_radar
      - name: Generate daily edition
        id: aggregate
        run: python -m agewell.pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com
          LLM_MODEL: deepseek-v4-flash
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          RSS_FEEDS_JSON: ${{ secrets.RSS_FEEDS_JSON }}
          MAX_ITEMS: 1
          MAX_ITEMS_PER_PUBLISHER: 2
          # No AUTO_PUBLISH_UNTIL: the trial window expired on 2026-08-09 and
          # would have silently turned every generated brief into a draft while
          # the runs — and the LLM spend — carried on. auto_publish_enabled()
          # still honours the variable if it is ever set again.
          AUTO_PUBLISH: true
      - name: Validate Upload-Post account
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Apikey ${UPLOAD_POST_API_KEY}" \
            https://api.upload-post.com/api/uploadposts/me
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      - name: Prepare social packages for release
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        run: python3 -m scripts.social_package --output .state/social/latest.json
      - name: Update reader trends
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m scripts.cloudflare_trending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Sync persistent social manifest
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        run: python3 -m scripts.social_manifest sync --packages .state/social/latest.json
      - name: Commit generated drafts
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "https://agewellbrief.com"
          changed = subprocess.run(
              ["git", "status", "--porcelain", "--", "content/posts"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          urls = []
          for line in changed:
              path = line[3:].strip()
              if path.startswith("content/posts/") and path.endswith(".md"):
                  slug = Path(path).stem
                  urls.append(f"{base}/brief/{slug}/")
          Path("/tmp/agewell-indexnow-urls.txt").write_text(
              "\n".join(dict.fromkeys(urls)) + ("\n" if urls else "")
          )
          PY
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- content/posts public/images public/*.txt .state
          git diff --cached --quiet || git commit -m "chore: add aggregated health briefs"
          git push
      - name: Submit released article copy to Facebook
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 -m scripts.publish_facebook --packages .state/social/latest.json
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USERNAME: ${{ secrets.UPLOAD_POST_USERNAME }}
      - name: Commit social handoff state
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        run: |
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .state/social .state/content-records .state/video-jobs
          git diff --cached --quiet || git commit -m "chore: record social publishing handoff"
          git push
      - name: Notify IndexNow
        if: ${{ always() && steps.aggregate.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          if [ -s /tmp/agewell-indexnow-urls.txt ]; then
            python3 -m scripts.submit_indexnow --urls-file /tmp/agewell-indexnow-urls.txt
          else
            echo "IndexNow: no article changes in this run"
          fi
        env:
          PUBLIC_SITE_URL: https://agewellbrief.com
          INDEXNOW_KEY_FILE: public/c82fc24c87f9437da381a53fd326273d.txt
