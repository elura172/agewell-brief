name: Classify affiliate destinations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Resolve and classify destinations
        run: python -m scripts.classify_affiliate_offers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com
          LLM_MODEL: deepseek-v4-flash
      - name: Commit reviewed taxonomy
        run: |
          git config user.name agewell-bot
          git config user.email actions@users.noreply.github.com
          git add config/affiliate-offer-review.json
          git diff --cached --quiet || git commit -m "chore: classify affiliate destinations"
          git push
