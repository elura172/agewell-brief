name: Backfill thin source articles

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of thin published articles to process"
        required: false
        default: "26"
      min_source_chars:
        description: "Treat audited sources below this size as thin"
        required: false
        default: "2500"
      dry_run:
        description: "Fetch and audit without changing article files"
        required: false
        type: boolean
        default: false

concurrency:
  group: agewell-source-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install browser for Google News URL resolution
        run: python -m playwright install chromium
      - name: Regenerate thin articles from source pages
        run: >-
          python3 -m scripts.backfill_full_source
          --limit "${{ inputs.limit }}"
          --min-source-chars "${{ inputs.min_source_chars }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          LLM_MODEL: gemini-3.5-flash
      - name: Commit regenerated articles and audit
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/posts .state/backfill
          git diff --cached --quiet || git commit -m "chore: backfill thin source articles"
          git push
