name: Probe FDA feeds (temporary diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe honest user agents from the Actions runner
        run: |
          set +e
          for u in \
            https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/consumers/rss.xml \
            https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/health-fraud/rss.xml \
            https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/tainted-dietary-supplements/rss.xml; do
            echo "== $u"
            for ua in \
              'AgewellBrief/0.3 (+https://agewellbrief.com; editorial research)' \
              'Mozilla/5.0 (compatible; AgewellBrief/0.3; editorial research)' \
              'Python-urllib/3.12'; do
              for try in 1 2; do
                printf "UA=[%s] try%s: " "$ua" "$try"
                curl -s -m 45 -o /tmp/f.xml -w "%{http_code} bytes=%{size_download} -> %{redirect_url}\n" -A "$ua" "$u"
              done
            done
          done
