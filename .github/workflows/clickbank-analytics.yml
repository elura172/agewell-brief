name: Refresh ClickBank analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch read-only analytics
        continue-on-error: true
        run: python -m scripts.clickbank_analytics
        env:
          CLICKBANK_API_KEY: ${{ secrets.CLICKBANK_API_KEY }}
          CLICKBANK_ACCOUNT_NICKNAME: ${{ secrets.CLICKBANK_ACCOUNT_NICKNAME }}
      - name: Commit analytics snapshot
        run: |
          git config user.name agewell-bot
          git config user.email actions@users.noreply.github.com
          git add .state/clickbank-analytics.json
          git diff --cached --quiet || git commit -m "chore: refresh ClickBank analytics"
          git pull --rebase origin main
          git push
