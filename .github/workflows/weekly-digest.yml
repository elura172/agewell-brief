name: Generate Sunday Biophysics Digest (Sovereign Email Outbox)

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 12:30 UTC (7:30 AM EST / 8:30 AM EDT)
    - cron: "30 12 * * 0"

permissions:
  contents: read

jobs:
  sunday-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Queue and dispatch Sunday Biophysics Digest via Sovereign Outbox
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not configured in GitHub yet; running dry-run preview."
            python3 scripts/generate_weekly_loops_digest.py --dry-run
          else
            python3 scripts/generate_weekly_loops_digest.py
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
