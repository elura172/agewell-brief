name: Generate Sunday Biophysics Digest (Loops Draft)

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 12:30 UTC (7:30 AM EST / 8:30 AM EDT)
    - cron: "30 12 * * 0"

permissions:
  contents: read

jobs:
  sunday-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Sunday Biophysics Digest draft in Loops
        run: |
          if [ -z "${LOOPS_API_KEY}" ]; then
            echo "LOOPS_API_KEY secret not configured in GitHub yet; running dry-run preview."
            python3 scripts/generate_weekly_loops_digest.py --dry-run
          else
            python3 scripts/generate_weekly_loops_digest.py
          fi
        env:
          LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
