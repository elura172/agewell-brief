name: Build operating scorecard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.scorecard
      - name: Commit scorecard
        run: |
          git config user.name agewell-bot
          git config user.email actions@users.noreply.github.com
          git add .state/scorecard.json
          git diff --cached --quiet || git commit -m "chore: refresh operating scorecard"
          git push
