name: Reconcile social publishing

on:
  workflow_dispatch:
  schedule:
    # Upload-Post jobs do not need minute-scale polling. Four checks per day
    # avoid needless Actions usage and repository churn.
    - cron: "17 */6 * * *"

concurrency:
  group: agewell-aggregation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile Upload-Post jobs
        run: python3 -m scripts.social_manifest status
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      - name: Commit social state
        run: |
          git config user.name "agewell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .state/social .state/content-records .state/video-jobs
          git diff --cached --quiet || git commit -m "chore: reconcile social publishing state"
          git push
